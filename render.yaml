services:
  - type: web
    name: muctieu-chay-xe
    runtime: node
    # Starter: dịch vụ không bị sleep như gói free
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        value: theodoi
      - key: VIEWER_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: TranDinhHung2003/Muctieu
      - key: GITHUB_BRANCH
        value: cursor/muc-tieu-chay-xe-becf
      - key: GITHUB_DATA_PATH
        value: data/app-data.json
      - key: GITHUB_MESSAGES_PATH
        value: data/messages.json
      - key: GITHUB_VAPID_PATH
        value: data/vapid.json
      - key: GITHUB_PUSH_PATH
        value: data/push-subscriptions.json
      - key: KEEP_ALIVE_MS
        value: "300000"
      # Render tự gắn RENDER_EXTERNAL_URL — server dùng để tự ping giữ máy
