services:
  - type: web
    name: muctieu-chay-xe
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        value: theodoi
      - key: VIEWER_PASSWORD
        sync: false
