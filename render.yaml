services:
  - type: web
    name: muctieu-chay-xe
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        value: theodoi
      - key: VIEWER_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: TranDinhHung2003/Muctieu
      - key: GITHUB_BRANCH
        value: cursor/muc-tieu-chay-xe-becf
      - key: GITHUB_DATA_PATH
        value: data/app-data.json
