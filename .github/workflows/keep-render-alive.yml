name: Keep Render Alive

# Ping health check mỗi 10 phút để dịch vụ không bị tắt vì idle
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -e
          URL="${RENDER_HEALTH_URL:-https://muctieu-chay-xe.onrender.com/api/health}"
          echo "Pinging $URL"
          for i in 1 2 3; do
            if curl -fsS --max-time 30 "$URL"; then
              echo
              echo "OK"
              exit 0
            fi
            echo "Retry $i..."
            sleep 5
          done
          echo "Keep-alive ping failed"
          exit 1
