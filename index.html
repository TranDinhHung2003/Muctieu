<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mục tiêu chạy xe hôm nay</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --accent: #22c55e;
      --accent-dim: #16a34a;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .goal-card {
      background: linear-gradient(135deg, #1e3a2f 0%, #1a2332 100%);
      border: 1px solid #22c55e44;
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin-bottom: 24px;
    }

    .goal-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .goal-amount {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      text-align: center;
      transition: border-color 0.3s, background 0.3s;
    }

    .result-card.done {
      border-color: var(--accent);
      background: linear-gradient(135deg, #1e3a2f 0%, var(--surface) 100%);
    }

    .result-card.over {
      border-color: var(--warning);
      background: linear-gradient(135deg, #3a2f1e 0%, var(--surface) 100%);
    }

    .result-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .result-amount {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .result-amount.positive { color: var(--accent); }
    .result-amount.zero { color: var(--accent); }
    .result-amount.over { color: var(--warning); }

    .result-sub {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .form-group label span.hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap .suffix {
      position: absolute;
      right: 14px;
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    input[type="number"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1.1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input.has-suffix {
      padding-right: 40px;
    }

    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 8px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-row .label {
      color: var(--text-muted);
    }

    .summary-row .value {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .summary-row .value.plus { color: var(--accent); }
    .summary-row .value.minus { color: var(--danger); }
    .summary-row.total {
      background: var(--surface-2);
      font-weight: 600;
    }

    .summary-row.total .value {
      color: var(--text);
      font-size: 1rem;
    }

    .reset-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .reset-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚗 Mục tiêu chạy xe</h1>
      <p id="today-date"></p>
    </header>

    <div class="goal-card">
      <div class="goal-label">Mục tiêu hôm nay</div>
      <div class="goal-amount">1.200.000đ</div>
    </div>

    <div class="result-card" id="result-card">
      <div class="result-label" id="result-label">Còn phải chạy thêm</div>
      <div class="result-amount positive" id="remaining">1.200.000đ</div>
      <div class="result-sub" id="result-sub">Nhập số liệu bên dưới để tính toán</div>
    </div>

    <p class="section-title">Nhập số liệu</p>

    <div class="form-group">
      <label for="app-income">
        Số tiền chạy trên app
      </label>
      <div class="input-wrap">
        <input type="number" id="app-income" class="has-suffix" min="0" step="1000" placeholder="0" value="0">
        <span class="suffix">đ</span>
      </div>
    </div>

    <div class="form-group">
      <label for="outside-income">
        Số tiền chạy ngoài
      </label>
      <div class="input-wrap">
        <input type="number" id="outside-income" class="has-suffix" min="0" step="1000" placeholder="0" value="0">
        <span class="suffix">đ</span>
      </div>
    </div>

    <div class="form-group">
      <label for="zoom-points">
        Số điểm trừ trên Zoom
        <span class="hint">1 điểm = −80.000đ</span>
      </label>
      <div class="input-wrap">
        <input type="number" id="zoom-points" class="has-suffix" min="0" step="0.5" placeholder="0" value="0">
        <span class="suffix">điểm</span>
      </div>
    </div>

    <div class="form-group">
      <label for="highway-fee">
        Số tiền cao tốc phải trả
      </label>
      <div class="input-wrap">
        <input type="number" id="highway-fee" class="has-suffix" min="0" step="1000" placeholder="0" value="0">
        <span class="suffix">đ</span>
      </div>
    </div>

    <p class="section-title" style="margin-top: 24px;">Chi tiết tính toán</p>

    <div class="summary">
      <div class="summary-row">
        <span class="label">Tiền chạy trên app</span>
        <span class="value plus" id="sum-app">+0đ</span>
      </div>
      <div class="summary-row">
        <span class="label">Tiền chạy ngoài</span>
        <span class="value plus" id="sum-outside">+0đ</span>
      </div>
      <div class="summary-row">
        <span class="label">Trừ điểm Zoom</span>
        <span class="value minus" id="sum-zoom">−0đ</span>
      </div>
      <div class="summary-row">
        <span class="label">Tiền cao tốc</span>
        <span class="value minus" id="sum-highway">−0đ</span>
      </div>
      <div class="summary-row total">
        <span class="label">Thực nhận hiện tại</span>
        <span class="value" id="sum-net">0đ</span>
      </div>
    </div>

    <button class="reset-btn" id="reset-btn">Đặt lại tất cả</button>

    <footer>Mục tiêu: 1.200.000đ / ngày</footer>
  </div>

  <script>
    const GOAL = 1200000;
    const ZOOM_RATE = 80000;

    const els = {
      todayDate: document.getElementById('today-date'),
      resultCard: document.getElementById('result-card'),
      resultLabel: document.getElementById('result-label'),
      remaining: document.getElementById('remaining'),
      resultSub: document.getElementById('result-sub'),
      appIncome: document.getElementById('app-income'),
      outsideIncome: document.getElementById('outside-income'),
      zoomPoints: document.getElementById('zoom-points'),
      highwayFee: document.getElementById('highway-fee'),
      sumApp: document.getElementById('sum-app'),
      sumOutside: document.getElementById('sum-outside'),
      sumZoom: document.getElementById('sum-zoom'),
      sumHighway: document.getElementById('sum-highway'),
      sumNet: document.getElementById('sum-net'),
      resetBtn: document.getElementById('reset-btn'),
    };

    function formatMoney(amount) {
      const abs = Math.abs(Math.round(amount));
      const formatted = abs.toLocaleString('vi-VN');
      if (amount < 0) return '−' + formatted + 'đ';
      return formatted + 'đ';
    }

    function parseInput(el) {
      const val = parseFloat(el.value);
      return isNaN(val) || val < 0 ? 0 : val;
    }

    function calculate() {
      const app = parseInput(els.appIncome);
      const outside = parseInput(els.outsideIncome);
      const zoomPts = parseInput(els.zoomPoints);
      const highway = parseInput(els.highwayFee);

      const zoomDeduction = zoomPts * ZOOM_RATE;
      const net = app + outside - zoomDeduction - highway;
      const remaining = GOAL - net;

      els.sumApp.textContent = '+' + formatMoney(app);
      els.sumOutside.textContent = '+' + formatMoney(outside);
      els.sumZoom.textContent = '−' + formatMoney(zoomDeduction);
      els.sumHighway.textContent = '−' + formatMoney(highway);
      els.sumNet.textContent = formatMoney(net);

      els.resultCard.classList.remove('done', 'over');
      els.remaining.classList.remove('positive', 'zero', 'over');

      if (remaining <= 0) {
        const surplus = Math.abs(remaining);
        els.resultCard.classList.add('done');
        els.resultLabel.textContent = 'Đã đạt mục tiêu!';
        els.remaining.textContent = surplus > 0 ? '+' + formatMoney(surplus) : '0đ';
        els.remaining.classList.add(surplus > 0 ? 'over' : 'zero');
        els.resultSub.textContent = surplus > 0
          ? 'Vượt mục tiêu ' + formatMoney(surplus)
          : 'Chúc mừng! Bạn đã đạt đủ 1.200.000đ';
      } else {
        els.remaining.textContent = formatMoney(remaining);
        els.remaining.classList.add('positive');
        els.resultLabel.textContent = 'Còn phải chạy thêm';
        const pct = Math.round((net / GOAL) * 100);
        els.resultSub.textContent = 'Đã đạt ' + pct + '% mục tiêu (' + formatMoney(net) + ' / 1.200.000đ)';
      }
    }

    function resetAll() {
      els.appIncome.value = 0;
      els.outsideIncome.value = 0;
      els.zoomPoints.value = 0;
      els.highwayFee.value = 0;
      calculate();
    }

    function setTodayDate() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      els.todayDate.textContent = now.toLocaleDateString('vi-VN', options);
    }

    [els.appIncome, els.outsideIncome, els.zoomPoints, els.highwayFee].forEach(el => {
      el.addEventListener('input', calculate);
    });

    els.resetBtn.addEventListener('click', resetAll);

    setTodayDate();
    calculate();
  </script>
</body>
</html>
